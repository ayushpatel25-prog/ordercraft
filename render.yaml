databases:
  - name: ordercraft-db
    databaseName: ordercraft
    user: ordercraft_admin
    plan: free
    region: oregon

services:
  # Spring Boot 3.3 Backend API
  - type: web
    name: ordercraft-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8085
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ordercraft-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ordercraft-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ordercraft-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # Angular Frontend (Nginx)
  - type: web
    name: ordercraft-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
