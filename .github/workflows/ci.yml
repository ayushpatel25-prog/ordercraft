name: OrderCraft CI/CD & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend for Production
      run: |
        cd frontend
        npm run build -- --configuration=production --base-href /ordercraft/

    - name: Copy index.html to 404.html for SPA Routing
      run: |
        cp frontend/dist/ordercraft-frontend/browser/index.html frontend/dist/ordercraft-frontend/browser/404.html

    - name: Build Backend & Run Tests
      run: |
        cd backend
        mvn clean test --batch-mode

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: frontend/dist/ordercraft-frontend/browser

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
